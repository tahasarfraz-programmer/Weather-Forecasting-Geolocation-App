{% load static %}<!DOCTYPE html>
<html lang="en" data-t="sky" data-sky="clear" data-n="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weatherly — Intelligent Weather &amp; Location</title>
<meta name="description" content="Weather intelligence, beautifully designed.">
<meta property="og:title" content="Weatherly — Intelligent Weather &amp; Location">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#1f5fd1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f5fd1'/%3E%3Ccircle cx='13' cy='14' r='6' fill='%23ffc94d'/%3E%3Cpath d='M9 24a5 5 0 010-10h11a5 5 0 010 10z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="{% static 'core/weatherly.css' %}">
</head>
<body>
<div id="sky" aria-hidden="true"><div id="orb"></div><div id="skyfx"></div></div>
<div class="shell">
<header class="bar">
<span class="brand" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 32 32"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1b3f9e"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#bg)"/><circle cx="13" cy="13" r="5.5" fill="#ffc94d"/><g fill="#fff"><circle cx="13" cy="21" r="4"/><circle cx="19" cy="18.5" r="5.2"/><circle cx="24" cy="22" r="3.6"/><rect x="13" y="21" width="11" height="4.6"/></g></svg></span>
<button id="locbtn" aria-haspopup="dialog" aria-label="Change location"></button>
<button class="ib" id="opal" aria-label="Search places and commands, Ctrl K" title="Search (Ctrl K)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
<button class="ib" id="loc" aria-label="Use my location" title="Use my location"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
<button class="ib" id="rf" aria-label="Refresh weather" title="Refresh"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
<button class="ib" id="th" aria-label="Change appearance" title="Appearance"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>
<main id="v" aria-live="polite"></main>
</div>
<nav class="dock" id="dock" aria-label="Primary"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="pal" hidden><div class="pbox" role="dialog" aria-modal="true" aria-label="Search places and commands">
<input id="pq" role="combobox" aria-expanded="true" aria-controls="plist" placeholder="Search a city, region or postal code, or type a command" autocomplete="off" aria-label="Search">
<div class="plist" id="plist" role="listbox"></div><div class="pfoot"><span>↑ ↓ to move</span><span>Enter to choose</span><span>Esc to close</span></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>window.WX={owm:{{ owm_enabled|yesno:"true,false" }}};</script>
<script src="{% static 'core/analytics.js' %}"></script>
<script src="{% static 'core/app.js' %}"></script>
</body>
</html>
